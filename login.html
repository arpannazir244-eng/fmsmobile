<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fbf5e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FMS Mobile">
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dnrgcigsj/image/upload/v1789365942/trio-dark-logo_ayyhkh.svg">
  <title>FMS Workspace — Sign in</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="login.css?v=1.0.5">
</head>

<body>
  <div class="auth-app">

    <!-- ── TOP SECTION: CREAM ROUNDED CONTAINER ── -->
    <div class="auth-top-card">
      <div class="brand-icon-circle">
        <img
          src="https://res.cloudinary.com/dnrgcigsj/image/upload/v1789365942/trio-dark-logo_ayyhkh.svg"
          alt="Trio Trend Exports Logo" class="brand-logo-img">
      </div>
      <h1 class="brand-title">FMS Workspace</h1>
      <p class="brand-subtitle">Trio Trend Exports Pvt. Ltd.</p>
    </div>

    <!-- ── BOTTOM SECTION: MINT GREEN AREA ── -->
    <div class="auth-bottom-content">
      
      <div class="welcome-header">
        <h2 class="welcome-title">Welcome!</h2>
        <p class="welcome-desc">Sign in to your production QC workspace</p>
      </div>

      <form class="login-form" id="loginForm">

        <div class="input-group">
          <label class="input-label" for="username">Username</label>
          <div class="input-field-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" class="login-input" id="username" placeholder="Enter your username" autocomplete="username" required>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-field-wrap">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" class="login-input" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
              <svg class="pw-icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="pw-icon-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="primary-pill-btn">
          <span>Let's Start</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>

      <div class="auth-footer-help">
        Trouble signing in? <a href="#" id="contactAdmin">Contact admin</a>
      </div>

    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="db.js?v=1.0.5"></script>
  <script src="main.js?v=1.0.5"></script>
  <script>
    document.getElementById('contactAdmin').addEventListener('click', (e) => {
      e.preventDefault();
      showToast('Please contact your IT admin for credentials');
    });
  </script>
</body>

</html>
